# appId 不随改名变动：它是 NSIS 的安装标识，改了旧版本就无法原地升级
appId: com.xlauncher.comfyui
productName: 探索者启动器
copyright: 探索者启动器 · ComfyUI Desktop Launcher

directories:
  output: release
  buildResources: build

# 只打包构建产物，脚本与源码不进 asar
files:
  - out/**/*
  - package.json
  - '!**/*.map'

asar: true

# 托盘在 asar 外读 ico，避免打包后右下角图标丢了
extraResources:
  - from: build/icon.ico
    to: icon.ico

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # 便携版 ComfyUI 与启动器都不需要管理员权限
  requestedExecutionLevel: asInvoker
  artifactName: ExplorerLauncher-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 探索者启动器
  # 卸载时保留用户配置（ComfyUI 路径、预设、代理设置等）
  deleteAppDataOnUninstall: false
  artifactName: ExplorerLauncher-${version}-setup.${ext}

portable:
  artifactName: ExplorerLauncher-${version}-portable.${ext}

# 与 src/main/services/selfUpdate.ts 的 UPDATE_OWNER / UPDATE_REPO 必须相同。
# --publish never 只在 release/ 写出 latest.yml，不上传。
publish:
  provider: github
  owner: Dontdrunk
  repo: Comfyui-EL-Launcher
